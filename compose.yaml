services:
  client:
    build:
      context: ./client
    environment:
      VITE_PROXY_TARGET: http://server:4000
    ports:
      - "5173:5173"
    depends_on:
      - server

  server:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/greencart
      CLIENT_URL: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data: